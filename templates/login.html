{% extends "base.html" %}

{% block title %}Sign In | AI-Workout and Diet Plan{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">

    <div class="card-header" style="text-align: center; display: block; border-bottom: none; padding-bottom: 0;">

      <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="fa-solid fa-lock"></i>
      </div>

      <h2 style="color: #fff; font-size: 1.6rem; font-weight: 800;">
        Welcome Back
      </h2>

      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
        Log in to access your workout routines and meal plans.
      </p>

    </div>

    <form action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}"
          method="POST"
          style="margin-top: 1.5rem;">

      <div class="form-group">
        <label class="form-label" for="username">
          Username or Email
        </label>

        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          placeholder="username or email"
          required
          autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="••••••••"
          required>
      </div>

      <!-- Forgot Password -->
      <div style="text-align: right; margin-top: -0.5rem; margin-bottom: 1rem;">
        <a
          href="{{ url_for('forgot_password') }}"
          style="color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600;">

          Forgot Password?

        </a>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">

        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        Sign In

      </button>

    </form>

    <!-- Create Account -->
    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-dark); font-size: 0.9rem; color: var(--text-muted);">

      Don't have an account yet?

      <a
        href="{{ url_for('register') }}"
        style="font-weight: 600; color: var(--primary);">

        Create Free Account

      </a>

    </div>

  </div>
</div>
{% endblock %}

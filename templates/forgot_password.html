{% extends "base.html" %}

{% block title %}Forgot Password | AI-Workout and Diet Plan{% endblock %}

{% block content %}

<div style="max-width: 440px; margin: 3rem auto;">

    <div class="card">

        <div class="card-header"
             style="text-align:center; display:block; border-bottom:none;">

            <div class="brand-icon"
                 style="margin:0 auto 1rem; width:48px; height:48px; font-size:1.5rem;">
                <i class="fa-solid fa-key"></i>
            </div>

            <h2 style="color:#fff; font-size:1.6rem;">
                Forgot Password?
            </h2>

            <p style="color:var(--text-muted);">
                Enter your username or email and create a new password.
            </p>

        </div>

        <form method="POST" style="margin-top:1.5rem;">

            <div class="form-group">

                <label class="form-label">
                    Username or Email
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username or email"
                    required
                >

            </div>

            <div class="form-group">

                <label class="form-label">
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    class="form-control"
                    placeholder="Enter new password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%; margin-top:0.5rem;">

                <i class="fa-solid fa-key"></i>
                Reset Password

            </button>

        </form>

        <div style="text-align:center; margin-top:1.5rem;">

            <a href="{{ url_for('login') }}"
               style="color:var(--primary); font-weight:600;">

                ← Back to Sign In

            </a>

        </div>

    </div>

</div>

{% endblock %}
